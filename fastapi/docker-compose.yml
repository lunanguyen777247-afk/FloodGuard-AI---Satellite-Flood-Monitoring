version: '3.8'

services:
  # FastAPI Backend
  backend:
    build: .
    container_name: floodguard-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
      - ./reports:/app/reports
      - ./cache:/app/cache
      - ./credentials:/app/credentials
    depends_on:
      - postgres
      - redis
    networks:
      - floodguard-network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: floodguard-postgres
    environment:
      POSTGRES_DB: floodguard_db
      POSTGRES_USER: floodguard_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-changeme123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - floodguard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floodguard_user -d floodguard_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: floodguard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - floodguard-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Celery Worker (for background tasks)
  celery-worker:
    build: .
    container_name: floodguard-celery-worker
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - floodguard-network
    restart: unless-stopped
    command: celery -A app.tasks worker --loglevel=info
    volumes:
      - ./app:/app/app

  # Celery Beat (for scheduled tasks)
  celery-beat:
    build: .
    container_name: floodguard-celery-beat
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - celery-worker
    networks:
      - floodguard-network
    restart: unless-stopped
    command: celery -A app.tasks beat --loglevel=info
    volumes:
      - ./app:/app/app

  # Nginx (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: floodguard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - floodguard-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  floodguard-network:
    driver: bridge
